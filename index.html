<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Sindicato del Rap - Historia y Estatutos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body { 
      height: 100vh; 
      width: 100vw;
      overflow: hidden;
      background: #1a1a1a;
      font-family: Arial, sans-serif;
    }
    #pdf-container { 
      width: 100%; 
      height: 100%; 
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1a1a;
    }
    /* Versión para móviles: el PDF ocupa toda la pantalla */
    embed {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }
    /* Solo para escritorio: el PDF se ve más centrado */
    @media (min-width: 768px) {
      #pdf-container {
        padding: 10px;
        background: #2c2c2c;
      }
      embed {
        max-width: 900px;
        max-height: 98vh;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        margin: auto;
      }
    }
    /* Pantalla de carga */
    .loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1a1a;
      color: #fff;
      font-size: 18px;
      z-index: 999;
      transition: opacity 0.8s ease;
      flex-direction: column;
      gap: 20px;
    }
    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 45px;
      height: 45px;
      border: 5px solid rgba(255,255,255,0.15);
      border-top: 5px solid #ff2d2d;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .fallback {
      display: none;
      text-align: center;
      padding: 40px 20px;
      color: #fff;
      background: #1a1a1a;
      height: 100vh;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }
    .fallback a {
      color: #ff6b6b;
      text-decoration: underline;
      font-size: 18px;
      display: inline-block;
      padding: 12px 25px;
      background: #2c2c2c;
      border-radius: 8px;
      border: 1px solid #ff6b6b;
    }
    .fallback a:hover {
      background: #ff6b6b;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Pantalla de carga -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span>Cargando documento...</span>
  </div>

  <!-- Contenedor del PDF -->
  <div id="pdf-container">
    <embed 
      id="pdfEmbed"
      src="https://raw.githubusercontent.com/Danielhumberto13/RUMEC-SHOP/main/Sindicato%20del%20Rap_Historia_Estatutos.pdf" 
      type="application/pdf"
    />
  </div>

  <!-- Fallback en caso de error -->
  <div class="fallback" id="fallback">
    <h2 style="font-size:24px;">📄 No se pudo cargar el PDF</h2>
    <p>Haz clic en el botón para descargarlo:</p>
    <a href="https://raw.githubusercontent.com/Danielhumberto13/RUMEC-SHOP/main/Sindicato%20del%20Rap_Historia_Estatutos.pdf" target="_blank">
      📥 Descargar PDF
    </a>
  </div>

  <script>
    const loading = document.getElementById('loading');
    const embed = document.getElementById('pdfEmbed');
    const fallback = document.getElementById('fallback');
    const container = document.getElementById('pdf-container');

    // Cuando el PDF se carga correctamente
    embed.addEventListener('load', function() {
      loading.classList.add('hidden');
    });

    // Si hay error al cargar
    embed.addEventListener('error', function() {
      loading.classList.add('hidden');
      container.style.display = 'none';
      fallback.style.display = 'flex';
    });

    // Timeout de seguridad: si no carga en 10 segundos, mostrar fallback
    setTimeout(function() {
      if (!loading.classList.contains('hidden')) {
        loading.classList.add('hidden');
        container.style.display = 'none';
        fallback.style.display = 'flex';
      }
    }, 10000);
  </script>

</body>
</html>
