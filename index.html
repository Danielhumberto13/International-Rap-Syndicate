<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Sindicato del Rap - Historia y Estatutos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body { 
      height: 100vh; 
      width: 100vw;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #1a1a1a;
    }
    #pdf-container { 
      width: 100%; 
      height: 100%; 
      display: flex;
      justify-content: center;
      align-items: center;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }
    /* Barra de carga sutil */
    .loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1a1a;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 18px;
      z-index: 999;
      transition: opacity 0.8s ease;
    }
    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading .spinner {
      width: 40px;
      height: 40px;
      margin-right: 15px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #ff4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .fallback {
      display: none;
      text-align: center;
      padding: 40px 20px;
      color: #fff;
      background: #1a1a1a;
      height: 100vh;
    }
    .fallback a {
      color: #ff6b6b;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Pantalla de carga -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span>Cargando documento...</span>
  </div>

  <div id="pdf-container">
    <iframe 
      id="pdfFrame"
      src="https://mozilla.github.io/pdf.js/web/viewer.html?file=https://raw.githubusercontent.com/Danielhumberto13/RUMEC-SHOP/main/Sindicato%20del%20Rap_Historia_Estatutos.pdf" 
      width="100%" 
      height="100%" 
      style="border: none;"
      allowfullscreen>
    </iframe>
  </div>
  
  <!-- Fallback en caso de error -->
  <div class="fallback" id="fallback">
    <h2>📄 No se pudo cargar el PDF</h2>
    <p>Puedes descargarlo manualmente aquí:</p>
    <p><a href="https://raw.githubusercontent.com/Danielhumberto13/RUMEC-SHOP/main/Sindicato%20del%20Rap_Historia_Estatutos.pdf" target="_blank">📥 Descargar PDF</a></p>
  </div>

  <script>
    const loading = document.getElementById('loading');
    const iframe = document.getElementById('pdfFrame');
    const fallback = document.getElementById('fallback');

    // Ocultar loading cuando el iframe carga
    iframe.addEventListener('load', function() {
      loading.classList.add('hidden');
    });

    // Si después de 8 segundos no cargó, mostrar fallback
    setTimeout(function() {
      if (!loading.classList.contains('hidden')) {
        loading.classList.add('hidden');
        fallback.style.display = 'block';
        document.getElementById('pdf-container').style.display = 'none';
      }
    }, 8000);

    // Si el iframe falla
    iframe.onerror = function() {
      loading.classList.add('hidden');
      fallback.style.display = 'block';
      document.getElementById('pdf-container').style.display = 'none';
    };
  </script>
</body>
</html>
