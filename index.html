<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sindicato del Rap - Historia y Estatutos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: #fff;
    }
    
    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      background-color: #222;
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid #ff0000;
    }
    
    .header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }
    
    .pdf-viewer {
      flex: 1;
      overflow: hidden;
    }
    
    .pdf-viewer embed,
    .pdf-viewer iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    
    .error {
      display: none;
      padding: 20px;
      background-color: #ff0000;
      text-align: center;
      font-size: 18px;
    }
    
    .error.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📚 Sindicato del Rap</h1>
      <p>Historia y Estatutos</p>
    </div>
    
    <div id="errorMsg" class="error"></div>
    
    <div class="pdf-viewer">
      <embed id="pdfViewer" src="Sindicato del Rap_Historia_Estatutos.pdf" type="application/pdf">
    </div>
  </div>

  <script>
    // Verificar que el PDF se cargue correctamente
    const pdfViewer = document.getElementById('pdfViewer');
    const errorMsg = document.getElementById('errorMsg');
    
    // Si el PDF no carga después de 5 segundos, mostrar mensaje de error
    setTimeout(() => {
      if (!pdfViewer.offsetHeight || pdfViewer.style.display === 'none') {
        errorMsg.textContent = '❌ Error: No se pudo cargar el PDF. Por favor intenta recargar la página.';
        errorMsg.classList.add('show');
      }
    }, 5000);
  </script>
</body>
</html>
